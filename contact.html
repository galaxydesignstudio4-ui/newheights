<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Contact - New Heights School</title>
<link rel="stylesheet" href="shared.css"/>
<style>
.contact-layout{display:grid;grid-template-columns:1fr 1.4fr;gap:clamp(28px,5vw,64px);align-items:start;}
.info-card{display:flex;gap:16px;align-items:flex-start;margin-bottom:26px;}
.info-icon{width:48px;height:48px;min-width:48px;border-radius:var(--r12);background:var(--g-light);display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.info-card h4{font-family:'DM Sans',sans-serif;font-weight:700;margin-bottom:3px;font-size:.92rem;}
.info-card p,.info-card a{font-size:.88rem;color:var(--gray);line-height:1.65;}
.info-card a{display:block;color:var(--gray);transition:var(--ease);}
.info-card a:hover{color:var(--g-primary);}
.map-box{border-radius:var(--r16);overflow:hidden;box-shadow:var(--sh2);margin-bottom:28px;}
.map-box iframe{width:100%;height:260px;border:none;display:block;}
.hours-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.hour-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--lgray);border-radius:var(--r8);font-size:.84rem;}
.hour-row span:last-child{font-weight:700;color:var(--g-primary);}
.cform{background:var(--white);border-radius:var(--r24);padding:clamp(24px,4vw,44px);box-shadow:var(--sh2);}
.cform h3{margin-bottom:24px;font-size:1.3rem;}
.whatsapp-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;background:#25D366;color:#fff;border-radius:var(--r100);font-weight:600;font-size:.94rem;transition:var(--ease);margin-top:16px;border:none;cursor:pointer;width:100%;justify-content:center;}
.whatsapp-btn:hover{background:#1ebe5a;transform:translateY(-2px);}
@media(max-width:800px){.contact-layout{grid-template-columns:1fr;}.hours-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="navPlaceholder"></div>
<div class="page-hero">
  <div class="container">
    <span class="label label-light">Get In Touch</span>
    <h1>Contact Us</h1>
    <p>We're always happy to hear from parents, students, and the community. Reach out and we'll respond promptly.</p>
  </div>
</div>
<section class="section section-white">
  <div class="container">
    <div class="contact-layout">
      <div>
        <div class="info-card">
          <div class="info-icon">📍</div>
          <div><h4>Our Location</h4><p id="cAddr"></p></div>
        </div>
        <div class="info-card">
          <div class="info-icon">📞</div>
          <div><h4>Phone Numbers</h4><p id="cPhones"></p></div>
        </div>
        <div class="info-card">
          <div class="info-icon">✉️</div>
          <div><h4>Email Address</h4><p id="cEmails"></p></div>
        </div>
        <div class="map-box"><iframe id="mapFrame" src="" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
        <h4 style="font-size:.88rem;font-family:'DM Sans',sans-serif;font-weight:700;margin-bottom:10px;">Office Hours</h4>
        <div class="hours-grid" id="hoursGrid"></div>
      </div>
      <div class="cform">
        <h3>Send a Message</h3>
        <div class="form-grid-2">
          <div class="form-field"><label>Your Full Name *</label><input type="text" id="cfName" placeholder="e.g. Kwame Mensah"/></div>
          <div class="form-field"><label>Phone Number *</label><input type="tel" id="cfPhone" placeholder="0244 000 000"/></div>
        </div>
        <div class="form-field"><label>Email Address</label><input type="email" id="cfEmail" placeholder="you@email.com"/></div>
        <div class="form-field">
          <label>Subject</label>
          <select id="cfSubject">
            <option>General Enquiry</option><option>Admissions</option>
            <option>Fees & Finance</option><option>Book a Visit</option>
            <option>Partnership / Sponsorship</option><option>Complaint / Feedback</option>
          </select>
        </div>
        <div class="form-field"><label>Message *</label><textarea id="cfMsg" placeholder="How can we help you?" style="min-height:120px;"></textarea></div>
        <button class="btn btn-primary btn-block" onclick="sendMsg()">Send Message →</button>
        <div class="msg-success" id="cfSuccess">Message sent. We'll reply within 1 business day.</div>
        <a id="waBtn" href="#" target="_blank" rel="noopener" class="whatsapp-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
          Chat on WhatsApp
        </a>
      </div>
    </div>
  </div>
</section>
<div id="footerPlaceholder"></div>
<script src="shared.js"></script>
<script>
async function sendMsg() {
  const name = document.getElementById('cfName').value.trim();
  const phone = document.getElementById('cfPhone').value.trim();
  const msg = document.getElementById('cfMsg').value.trim();
  if (!name || !phone || !msg) {
    alert('Please fill in name, phone, and message.');
    return;
  }

  try {
    await NHS.addMessage({
      name,
      phone,
      email: document.getElementById('cfEmail').value,
      subject: document.getElementById('cfSubject').value,
      message: msg
    });
    document.getElementById('cfSuccess').style.display = 'block';
    ['cfName', 'cfPhone', 'cfEmail', 'cfMsg'].forEach((id) => document.getElementById(id).value = '');
  } catch (err) {
    alert(`Message send failed: ${err.message || err}`);
  }
}

(async function () {
  NHS.initLocal();
  renderNav('contact.html');
  renderFooter();
  await NHS.init();
  renderNav('contact.html');
  renderFooter();
  const D = NHS.get();
  document.getElementById('cAddr').textContent = D.contactAddress;
  document.getElementById('cPhones').innerHTML = [D.contactPhone1, D.contactPhone2].filter(Boolean).map((p) => `<a href="tel:${p}">${p}</a>`).join('');
  document.getElementById('cEmails').innerHTML = [D.contactEmail1, D.contactEmail2].filter(Boolean).map((e) => `<a href="mailto:${e}">${e}</a>`).join('');
  document.getElementById('mapFrame').src = D.googleMapEmbed;
  document.getElementById('waBtn').href = D.socialLinks.whatsapp;
  document.getElementById('hoursGrid').innerHTML = (D.officeHours || []).map((h) => `
    <div class="hour-row"><span>${h.day}</span><span>${h.hours}</span></div>`).join('');
})();
</script>
</body>
</html>
