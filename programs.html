<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Programs — New Heights School</title>
<link rel="stylesheet" href="shared.css"/>
<style>
.prog-full{display:grid;grid-template-columns:1fr;gap:clamp(24px,4vw,40px);}
.prog-full-card{background:var(--white);border-radius:var(--r24);overflow:hidden;box-shadow:var(--sh2);display:grid;grid-template-columns:320px 1fr;transition:var(--ease);}
.prog-full-card:hover{box-shadow:var(--sh3);transform:translateY(-3px);}
.pfc-img{position:relative;overflow:hidden;background:var(--g-light);display:flex;align-items:center;justify-content:center;font-size:5rem;min-height:260px;}
.pfc-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
.prog-full-card:hover .pfc-img img{transform:scale(1.05);}
.pfc-badge{position:absolute;top:16px;left:16px;background:var(--g-primary);color:#fff;padding:5px 14px;border-radius:var(--r100);font-size:.78rem;font-weight:700;}
.pfc-body{padding:clamp(24px,3vw,40px);}
.pfc-body h2{font-size:clamp(1.3rem,2.5vw,1.7rem);margin-bottom:10px;color:var(--g-dark);}
.pfc-body>p{font-size:.94rem;line-height:1.75;margin-bottom:20px;}
.feat-list{display:flex;flex-direction:column;gap:8px;}
.feat-item{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:500;}
.feat-item::before{content:'✓';color:var(--g-primary);font-weight:800;min-width:18px;}
.pfc-cta{margin-top:24px;}
@media(max-width:760px){.prog-full-card{grid-template-columns:1fr;}.pfc-img{min-height:220px;height:220px;}}
</style>
</head>
<body>
<div id="navPlaceholder"></div>
<div class="page-hero">
  <div class="container">
    <span class="label label-light">Academics</span>
    <h1>Our Academic Programs</h1>
    <p>A complete, hybrid Montessori-GES academic journey from Nursery to JHS — all under one caring roof.</p>
  </div>
</div>
<section class="section section-white">
  <div class="container">
    <div class="prog-full" id="progFull"></div>
  </div>
</section>
<section class="cta-banner">
  <div class="container">
    <h2>Find the Right Program for Your Child</h2>
    <p>Our admissions team is ready to guide you through every step of the process.</p>
    <a href="admissions.html" class="btn btn-lime">Apply for Admission →</a>
  </div>
</section>
<div id="footerPlaceholder"></div>
<script src="shared.js"></script>
<script>
(async function () {
NHS.initLocal();
renderNav('programs.html'); renderFooter();
await NHS.init();
renderNav('programs.html'); renderFooter();
const D = NHS.get();
const feats=[
  ["Qualified, caring teachers","Play-based experiential learning","Language & numeracy foundations","Music, art & movement activities"],
  ["Structured daily routines","Social & emotional skills","Early reading & writing","Smooth transition to primary"],
  ["Hybrid Montessori-GES curriculum","English, Maths, Science, Ghanaian Language","Physical Education & Creative Arts","Regular progress assessments"],
  ["Comprehensive BECE preparation","ICT & digital literacy","Leadership & life skills","Science practicals & projects"]
];
document.getElementById('progFull').innerHTML = D.programs.map((p,i)=>`
  <div class="prog-full-card reveal">
    <div class="pfc-img">
      ${p.image?`<img src="${p.image}" alt="${p.title}" loading="lazy"/>`:['🌱','📖','🔬','🏫'][i]}
      <span class="pfc-badge">${p.badge}</span>
    </div>
    <div class="pfc-body">
      <h2>${p.title}</h2>
      <p>${p.text}</p>
      <div class="feat-list">${(feats[i]||feats[2]).map(f=>`<div class="feat-item">${f}</div>`).join('')}</div>
      <div class="pfc-cta"><a href="admissions.html" class="btn btn-primary btn-sm">Enroll in ${p.title} →</a></div>
    </div>
  </div>`).join('');
initReveal();
})();
</script>
</body>
</html>
